name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/backend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  voice-guard:
    name: Voice guard (banned words in war room)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan GTM War Room for banned words
        shell: pwsh
        run: |
          # Same rules as .claude/hooks/messaging-guard.ps1: scan war-room markdown,
          # skip the files that legitimately quote banned terms as rules, and
          # (per-line) skip a hit when the line is clearly documenting the term
          # itself rather than using it — e.g. a style-guide glossary row like
          # "| learn more | replaces the retired 'know more' |".
          $words = Get-Content .claude/hooks/forbidden-words.txt | Where-Object { $_.Trim() -ne "" }
          $docMarkers = "avoid|retired|replaces|banned|never say|don't say|not \""
          $files = Get-ChildItem GTM-War-Room -Recurse -Filter *.md |
            Where-Object { $_.FullName -notmatch 'gtm-rules|brand-voice|HANDOVER' }
          $fail = $false
          foreach ($f in $files) {
            $lines = Get-Content $f.FullName
            for ($i = 0; $i -lt $lines.Count; $i++) {
              $line = $lines[$i]
              foreach ($w in $words) {
                if ($line -imatch [regex]::Escape($w)) {
                  if ($line -imatch $docMarkers) { continue } # documenting the rule, not violating it
                  $rel = [System.IO.Path]::GetRelativePath((Get-Location), $f.FullName)
                  $lineNum = $i + 1
                  Write-Host "::error file=$rel,line=$lineNum::Banned phrase '$w' found (Voice of Aurigo standards)"
                  $fail = $true
                }
              }
            }
          }
          if ($fail) { exit 1 }
          Write-Host "Voice guard passed: no banned phrases in war-room content."
